{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Categories</h2>
    {% if categories %}
        <ul>
            {% for category in categories %}
                <li>
                    <a href="{% url 'category_detail' category.id %}">{{ category.name }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No categories are available.</p>   
    {% endif %}
{% endblock %}
